  </g>

  <g stroke-width="3" stroke-linejoin="round">
      <path fill="#b06f14" stroke="#b06f14" d="M88.5 58.62 L113.5 52.85 L113.5 71.15 L88.5 65.38 Z"/>
      <path fill="#f5c93f" stroke="#f5c93f" d="M89.25 60.95 L112.75 55.53 L112.75 70.22 L89.25 64.8 Z"/>
      <path fill="#e2a127" stroke="#e2a127" d="M89.25 60.95 L102.3 57.94 A41.5 41.5 0 0 1 102.1 67.76 L89.25 64.8 Z"/>
