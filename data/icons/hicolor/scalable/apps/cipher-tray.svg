<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <title>Cipher tray</title>
  <!--
    Generated by tools/generate-tray-icons.py, which re-paints the symbolic
    icon rather than redrawing it. Edits here are lost the next time it runs;
    change the symbolic icon instead. The notes below are the template's own
    and describe that file.
  -->
  <!--
    SPDX-License-Identifier: GPL-3.0-only

    Symbolic form of the application icon: the cipher wheel, its hub and the
    handle, reduced to flat monochrome shapes. Ring and handle tip share a
    radius of 7.25; the break in the ring clears the handle by 1.33px at the
    ring's inner edge.

    Every shape is a fill and nothing here is stroked. That is not a style
    choice: GTK recolours a symbolic icon by wrapping the file in a stylesheet
    that sets fill on rect, circle and path, which leaves a stroke exactly as
    authored. An outline drawn with stroke would keep its authored colour and
    disappear against a dark panel, so each outline is expanded into the path
    that fills it instead. Regenerating from a stroked drawing means expanding
    the strokes again, not pasting them back.

    The root element opens the file, with no XML declaration and no comment
    ahead of it, matching the tray icons. That is not a style choice either:
    gdk-pixbuf identifies an image by sniffing its leading bytes, and anything
    above the root pushes the tag out of the window it looks at. The file stays
    valid XML and still renders, but flatpak-validate-icon rejects every
    exported icon it cannot identify, so the export fails with "Format not
    recognized".

    Note also that a double hyphen cannot appear in an XML comment. It makes
    the file malformed, which fails the same check by a different route.
  -->
